<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Advisor — Analytics Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">CA</span>
      <span class="brand-name">Change Advisor</span>
    </div>
    <nav class="nav">
      <button class="nav-item active" data-view="overview">📊 Overview</button>
      <button class="nav-item" data-view="changes">🔁 Changes</button>
      <button class="nav-item" data-view="risk">⚠️ Risk</button>
      <button class="nav-item" data-view="table">📋 Records</button>
    </nav>
    <div class="sidebar-footer">
      <button id="themeToggle" class="theme-toggle">🌗 Toggle theme</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="viewTitle">Overview</h1>
        <p class="subtitle" id="viewSubtitle">Change activity across all services</p>
      </div>
      <div class="controls">
        <label class="control">
          Range
          <select id="rangeSelect">
            <option value="7">Last 7 days</option>
            <option value="30" selected>Last 30 days</option>
            <option value="90">Last 90 days</option>
          </select>
        </label>
        <label class="control">
          Team
          <select id="teamSelect">
            <option value="all" selected>All teams</option>
          </select>
        </label>
      </div>
    </header>

    <section class="kpis" id="kpis"></section>

    <section class="grid">
      <div class="card span-2">
        <div class="card-head">
          <h2>Change volume</h2>
          <span class="card-hint" id="volumeHint"></span>
        </div>
        <canvas id="volumeChart" height="240"></canvas>
      </div>
      <div class="card">
        <div class="card-head"><h2>Outcome mix</h2></div>
        <canvas id="outcomeChart" height="240"></canvas>
        <div class="legend" id="outcomeLegend"></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Risk by team</h2></div>
        <canvas id="riskChart" height="240"></canvas>
      </div>
      <div class="card span-2">
        <div class="card-head">
          <h2>Recent changes</h2>
          <input id="search" class="search" type="search" placeholder="Filter by service or author…" />
        </div>
        <div class="table-wrap">
          <table id="dataTable">
            <thead>
              <tr>
                <th data-sort="date">Date ▾</th>
                <th data-sort="service">Service</th>
                <th data-sort="author">Author</th>
                <th data-sort="team">Team</th>
                <th data-sort="risk">Risk</th>
                <th data-sort="outcome">Outcome</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
    <footer class="footer">Generated static demo · no backend · vanilla JS</footer>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
